<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта разборок ZapBasalt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
        #map { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Инициализация карты с центром в Москве (или вашем городе)
        var map = L.map('map').setView([55.7558, 37.6173], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Пример точек авторазборок и объявлений из базы
        var markers = [
            {lat: 55.7558, lon: 37.6173, title: "АвтоРазбор МСК: Генератор Bosch — 8500 ₽"},
            {lat: 55.4312, lon: 37.5447, title: "Подольск Разбор: Фара LED Toyota — 15000 ₽"}
        ];

        markers.forEach(function(m) {
            L.marker([m.lat, m.lon]).addTo(map).bindPopup("<b>" + m.title + "</b>");
        });
    </script>
</body>
</html>
